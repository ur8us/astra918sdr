[package]
name = "astra918-firmware"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = []
device = []
rp235xa = ["embassy-rp/rp235xa"]
rp235xb = ["embassy-rp/rp235xb"]

[[bin]]
name = "astra918"
path = "src/main.rs"
required-features = ["device"]
test = false
bench = false

[dependencies]
embedded-hal = "=1.0.0"
embedded-hal-async = "=1.0.0"
libm = "=0.2.16"

[target.'cfg(target_arch = "arm")'.dependencies]
embassy-embedded-hal = "=0.6.0"
embassy-rp = { version = "=0.10.0", features = ["time-driver", "critical-section-impl", "unstable-pac"] }
embassy-executor = { version = "=0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-usb = { version = "=0.6.0", default-features = false, features = ["max-interface-count-5"] }
embassy-time = "=0.5.1"
embassy-sync = "=0.8.0"
embassy-futures = "=0.1.2"
cortex-m = "=0.7.7"
cortex-m-rt = "=0.7.5"
static_cell = "=2.1.1"
pio = "=0.3.0"
fixed = "=1.29.0"
defmt = "=1.1.1"
defmt-rtt = { version = "=1.3.0", features = ["disable-blocking-mode"] }

[dev-dependencies]
embassy-usb = { version = "=0.6.0", default-features = false, features = ["max-interface-count-5"] }
futures = { version = "0.3", features = ["executor"] }
critical-section = { version = "1.2", features = ["std"] }
