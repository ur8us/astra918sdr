name: Offline firmware and host
on: [push, pull_request, workflow_dispatch]
jobs:
  host:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release -p astra918-host
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [rp235xa, rp235xb]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: thumbv8m.main-none-eabihf
      - name: Install picotool
        run: |
          sudo apt-get update
          sudo apt-get install --yes picotool
      - name: Build ELF and UF2
        run: python3 scripts/build_firmware.py --variant ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.variant }}
          path: artifacts/${{ matrix.variant }}/
          if-no-files-found: error
