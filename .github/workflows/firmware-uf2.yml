name: Firmware UF2
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: thumbv8m.main-none-eabihf
      - name: Install picotool
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/raspberrypi/pico-sdk-tools/releases/download/v2.3.1-0/picotool-2.3.1-x86_64-lin.tar.gz \
            --output "$RUNNER_TEMP/picotool.tar.gz"
          echo "878a1a1e7d8336b8be60300c7218f366d9790c0d3a211b181d6d172e80b1248e  $RUNNER_TEMP/picotool.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/picotool.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/picotool" >> "$GITHUB_PATH"
      - name: Build Raspberry Pi Pico 2 UF2
        run: python3 scripts/build_firmware.py --board rpipico2
      - name: Upload Raspberry Pi Pico 2 UF2
        uses: actions/upload-artifact@v4
        with:
          name: astra918-rpipico2-uf2
          path: artifacts/astra918-rpipico2.uf2
          if-no-files-found: error
      - name: Publish tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/astra918-rpipico2.uf2 \
            --verify-tag \
            --title "Astra918 firmware $GITHUB_REF_NAME" \
            --notes "Raspberry Pi Pico 2 firmware built from this tag for RP2350A with a 12 MHz MCU crystal and 4 MiB flash."
