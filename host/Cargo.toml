[package]
name = "astra918-host"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
astra918-firmware = { path = "../firmware" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
rusb = { version = "0.9", features = ["vendored"] }
libc = "0.2"

[[bin]]
name = "astra918-sim"
path = "src/simulator.rs"

[[bin]]
name = "astra918ctl"
path = "src/cli.rs"
